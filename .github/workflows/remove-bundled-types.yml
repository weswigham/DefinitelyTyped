name: Remove declarations bundled by npm packages

on:
  schedule:
    # https://crontab.guru/#0_0_*_*_1
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remove-bundled-types
  cancel-in-progress: false

jobs:
  remove-bundled-types:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: github.repository == 'DefinitelyTyped/DefinitelyTyped'
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: ./.github/actions/setup-for-scripts

      - name: Remove, test and commit each validated removal
        id: removals
        run: |
          git config user.email "290192711+typescript-automation[bot]@users.noreply.github.com"
          git config user.name "typescript-automation[bot]"
          pnpm --silent run remove-bundled-types > "$RUNNER_TEMP/comment.md"
          if [ -s "$RUNNER_TEMP/comment.md" ]; then
            echo "has-removals=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.removals.outputs.has-removals == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: 'typescript-automation[bot] <290192711+typescript-automation[bot]@users.noreply.github.com>'
          author: 'typescript-automation[bot] <290192711+typescript-automation[bot]@users.noreply.github.com>'
          branch: 'remove-bundled-types'
          branch-suffix: short-commit-hash
          delete-branch: true
          title: Remove declarations for packages that now bundle types
          body-path: ${{ runner.temp }}/comment.md
